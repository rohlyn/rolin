<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Lorraine's studio</title>
    
    <title>精确北京时间</title>
    <!-- 引入等宽数字字体，防止跳动时宽度抖动 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.5);
            --ms-color: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* 背景动态光斑装饰 */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: #3b82f6; top: 10%; left: 20%; }
        .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: 10%; right: 15%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        /* 时钟卡片容器 */
        .clock-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 4rem;
            text-align: center;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .date-display {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .time-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .time-main {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums; /* 关键：等宽数字 */
        }

        .time-ms {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: var(--ms-color);
            font-weight: 400;
            min-width: 3.5ch;
            text-align: left;
            opacity: 0.9;
        }

        /* 毫秒部分的微妙呼吸动画 */
        .time-ms::before {
            content: '.';
            margin-right: 2px;
        }

        @media (max-width: 600px) {
            .clock-card { padding: 2rem 1.5rem; width: 90%; }
        }

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card p {
            color: #ccc;
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .link-btn .icon {
            font-size: 1.3rem;
        }

        .footer {
            margin-top: 32px;
            color: #666;
            font-size: 0.85rem;
        }

        .tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="clock-card">
        <div class="label">Beijing Time · UTC+8</div>
        <div class="date-display" id="dateDisplay">----年--月--日 星期-</div>
        <div class="time-wrapper">
            <span class="time-main" id="timeMain">--:--:--</span>
            <span class="time-ms" id="timeMs">---</span>
        </div>
    </div>
    <div class="container">
        <!-- 头像 -->
        <div class="avatar">😎</div>

        <!-- 名字 -->
        <h1>你好，我是Lorraine</h1>
        <p class="subtitle">🧑‍💻 开发者 · 📝 写作者 · 🚀 终身学习者</p>

        <!-- 介绍卡片 -->
        <div class="card">
            <p>
                欢迎来到我的个人主页！这里是我在互联网上的一片小天地。
                喜欢折腾代码、分享技术、记录生活。
            </p>
            <div style="margin-top: 16px;">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Python</span>
            </div>
        </div>

        <!-- 链接按钮 -->
        <div class="links">
            <a href="#" class="link-btn">
                <span class="icon">📂</span> 我的项目
            </a>
            <a href="#" class="link-btn">
                <span class="icon">📝</span> 博客文章
            </a>
            <a href="#" class="link-btn">
                <span class="icon">🐙</span> GitHub
            </a>
            <a href="#" class="link-btn">
                <span class="icon">💬</span> 联系我
            </a>
        </div>

        <!-- 页脚 -->
        <p class="footer">
            © 2026 Lorraine · 由 Cloudflare Pages 驱动 · 全世界秒开 🚀
        </p>
    </div>
    <script>
        // 使用 Intl API 确保时区始终为北京时间，不受本地系统时区影响
        const bjDateFormatter = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long'
        });

        const bjTimeFormatter = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });

        const dateEl = document.getElementById('dateDisplay');
        const timeMainEl = document.getElementById('timeMain');
        const timeMsEl = document.getElementById('timeMs');

        let lastSecond = -1;

        function updateClock() {
            const now = new Date();
            
            // 获取北京时间的各部分
            // 注意：为了精确获取毫秒，我们直接使用 UTC 偏移计算
            // 因为 Intl 格式化毫秒在不同浏览器支持不一致
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const bjNow = new Date(utc + 8 * 3600000);
            
            const h = String(bjNow.getHours()).padStart(2, '0');
            const m = String(bjNow.getMinutes()).padStart(2, '0');
            const s = String(bjNow.getSeconds()).padStart(2, '0');
            const ms = String(bjNow.getMilliseconds()).padStart(3, '0');

            // 仅在秒数变化时更新日期和主时间字符串，减少 DOM 重排
            const currentSecond = s;
            if (currentSecond !== lastSecond) {
                timeMainEl.textContent = `${h}:${m}:${s}`;
                
                // 更新日期（每秒检查一次足够）
                const dateParts = bjDateFormatter.formatToParts(now);
                const getPart = (type) => dateParts.find(p => p.type === type)?.value || '';
                dateEl.textContent = `${getPart('year')}年${getPart('month')}月${getPart('day')}日 ${getPart('weekday')}`;
                
                lastSecond = currentSecond;
            }

            // 毫秒每帧都更新
            timeMsEl.textContent = ms;

            requestAnimationFrame(updateClock);
        }

        // 启动时钟
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
