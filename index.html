<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lorraine's Studio | 精确北京时间</title>

    <!-- 引入等宽数字字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-glow: rgba(56, 189, 248, 0.5);
        --ms-color: #38bdf8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top left, #1e293b, #0f172a);
        font-family: "JetBrains Mono", monospace;
        color: var(--text-primary);
        padding: 20px;
      }

      /* 背景动态光斑 */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        opacity: 0.4;
        animation: float 10s infinite ease-in-out alternate;
        pointer-events: none;
      }
      .orb-1 {
        width: 300px;
        height: 300px;
        background: #3b82f6;
        top: 10%;
        left: 20%;
      }
      .orb-2 {
        width: 400px;
        height: 400px;
        background: #8b5cf6;
        bottom: 10%;
        right: 15%;
        animation-delay: -5s;
      }
      @keyframes float {
        0% { transform: translate(0, 0); }
        100% { transform: translate(30px, 50px); }
      }

      /* 主容器 */
      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 600px;
        width: 100%;
      }

      /* 时钟卡片 */
      .clock-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem 4rem;
        margin-bottom: 40px;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
      }

      .label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        color: var(--text-secondary);
        font-weight: 700;
      }

      .date-display {
        font-size: 1.1rem;
        color: var(--text-secondary);
        font-weight: 400;
        min-height: 1.6em;
      }

      .time-wrapper {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 4px;
        text-shadow: 0 0 20px var(--accent-glow);
      }

      .time-main {
        font-size: clamp(3rem, 8vw, 5.5rem);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .time-ms {
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        color: var(--ms-color);
        font-weight: 400;
        min-width: 3.5ch;
        text-align: left;
        opacity: 0.9;
        font-variant-numeric: tabular-nums;
      }
      .time-ms::before {
        content: ".";
        margin-right: 2px;
      }

      /* 个人信息区 */
      h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
        background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
        margin-bottom: 28px;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 28px 32px;
        margin-bottom: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
      }
      .card p {
        color: #ccc;
        line-height: 1.8;
        font-size: 1rem;
      }
      .tags {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag {
        background: rgba(255, 255, 255, 0.1);
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        color: #ccc;
      }

      /* 链接按钮 */
      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .link-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        color: #fff;
        text-decoration: none;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }
      .link-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .footer {
        margin-top: 32px;
        color: #555;
        font-size: 0.8rem;
      }

      /* 响应式 */
      @media (max-width: 600px) {
        .clock-card { padding: 2rem 1.5rem; }
        .links { grid-template-columns: 1fr; }
        h1 { font-size: 1.8rem; }
      }
    </style>
  </head>
  <body>
    <!-- 背景光斑 -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
      <!-- 时钟卡片 -->
      <div class="clock-card" role="timer" aria-label="精确北京时间">
        <div class="label">Beijing Time · UTC+8</div>
        <div class="date-display" id="dateDisplay">----年--月--日 星期-</div>
        <div class="time-wrapper">
          <span class="time-main" id="timeMain" aria-live="polite">--:--:--</span>
          <span class="time-ms" id="timeMs" aria-hidden="true">---</span>
        </div>
      </div>

      <!-- 个人信息 -->
      <h1>你好，我是 Lorraine</h1>
      <p class="subtitle">💻 开发者 · 📝 写作者 · 🚀 终身学习者</p>

      <div class="card">
        <p>
          欢迎来到我的个人主页！这里是我在互联网上的一片小天地。<br />
          喜欢折腾代码、分享技术、记录生活。
        </p>
        <div class="tags">
          <span class="tag">HTML</span>
          <span class="tag">CSS</span>
          <span class="tag">JavaScript</span>
          <span class="tag">Python</span>
        </div>
      </div>

      <!-- 链接 -->
      <div class="links">
        <a href="#" class="link-btn"><span>📂</span> 我的项目</a>
        <a href="#" class="link-btn"><span>📝</span> 博客文章</a>
        <a href="#" class="link-btn"><span>🐙</span> GitHub</a>
        <a href="#" class="link-btn"><span>💬</span> 联系我</a>
      </div>

      <p class="footer">© 2026 Lorraine · 由 Cloudflare Pages 驱动 · 全世界秒开 🚀</p>
    </div>

    <script>
      const dateEl = document.getElementById("dateDisplay");
      const timeMainEl = document.getElementById("timeMain");
      const timeMsEl = document.getElementById("timeMs");

      const bjDateFormatter = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "long",
      });

      let lastSecond = -1;
      let lastMinute = -1;

      function updateClock() {
        const now = new Date();

        // 手动计算北京时间毫秒（避免 Intl 毫秒兼容性问题）
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        const bjNow = new Date(utc + 8 * 3600000);

        const h = String(bjNow.getHours()).padStart(2, "0");
        const m = String(bjNow.getMinutes()).padStart(2, "0");
        const s = String(bjNow.getSeconds()).padStart(2, "0");
        const ms = String(bjNow.getMilliseconds()).padStart(3, "0");

        const currentSecond = parseInt(s, 10);
        const currentMinute = parseInt(m, 10);

        // 仅在秒变化时更新主时间
        if (currentSecond !== lastSecond) {
          timeMainEl.textContent = `${h}:${m}:${s}`;
          lastSecond = currentSecond;
        }

        // 仅在分钟变化时更新日期（减少昂贵的 formatToParts 调用）
        if (currentMinute !== lastMinute) {
          const parts = bjDateFormatter.formatToParts(now);
          const get = (type) => parts.find((p) => p.type === type)?.value || "";
          dateEl.textContent = `${get("year")}年${get("month")}月${get("day")}日 ${get("weekday")}`;
          lastMinute = currentMinute;
        }

        // 毫秒每帧更新
        timeMsEl.textContent = ms;

        requestAnimationFrame(updateClock);
      }

      requestAnimationFrame(updateClock);
    </script>
  </body>
</html>
